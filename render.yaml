# Blueprint do Render: um serviço web (Docker) + Postgres gerenciado.
# Render > New > Blueprint > aponte para este repositório. Informe ADMIN_EMAIL e ADMIN_PASSWORD (12+ caracteres).
services:
  - type: web
    name: burger-lab
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: burger-lab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PIX_WEBHOOK_SECRET
        generateValue: true
      # Pix real (opcional). Sem PIX_PROVIDER o sistema usa o simulador.
      - key: PIX_PROVIDER
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      # Vitrine do portfólio: liga o Pix de teste e mostra contas de demonstração no login.
      # DEMO_LOGINS="Admin|email|senha;Cozinha|email|senha" (o rótulo define o perfil: Admin, Cozinha ou Caixa). As contas são criadas/redefinidas a cada início
      # (exige SEED_ON_BOOT=true). Não vale com Pix real.
      - key: DEMO_MODE
        sync: false
      - key: DEMO_LOGINS
        sync: false
      - key: SEED_ON_BOOT
        value: "true"
      - key: ADMIN_URL
        # Endereço público do app da equipe, usado no link do e-mail de redefinição de senha.
        # Ex.: https://burger-lab.onrender.com/admin/
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: burger-lab-db
    databaseName: burgerlab
    user: burger
