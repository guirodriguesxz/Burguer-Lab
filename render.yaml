# Blueprint do Render: um serviço web (Docker) + Postgres gerenciado.
# Render > New > Blueprint > aponte para este repositório. Informe ADMIN_EMAIL e ADMIN_PASSWORD (12+ caracteres).
services:
  - type: web
    name: burger-lab
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: burger-lab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PIX_WEBHOOK_SECRET
        generateValue: true
      - key: SEED_ON_BOOT
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: burger-lab-db
    databaseName: burgerlab
    user: burger
