# Produção em uma máquina só: Postgres + aplicação (API + totem + admin).
#   cp .env.prod.example .env   (e preencha os segredos)
#   docker compose -f docker-compose.prod.yml up -d --build
# Totem: http://localhost:3000   Equipe: http://localhost:3000/admin/
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: burger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: burgerlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burger -d burgerlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://burger:${POSTGRES_PASSWORD}@db:5432/burgerlab?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      PIX_WEBHOOK_SECRET: ${PIX_WEBHOOK_SECRET:?defina PIX_WEBHOOK_SECRET}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD (mínimo 12 caracteres)}
      # Endereço público do app da equipe (link do e-mail de redefinição). Ex.: https://loja.exemplo.com/admin/
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3000/admin/}
      # Opcional: envio real de e-mail via Resend. Sem isso o link de redefinição aparece só no log do container.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      KITCHEN_EMAIL: ${KITCHEN_EMAIL:-}
      KITCHEN_PASSWORD: ${KITCHEN_PASSWORD:-}

volumes:
  pgdata:
