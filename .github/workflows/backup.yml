name: Backup do banco

# Backup diário, criptografado (AES-256-GCM) e verificado, guardado como artefato por 30 dias.
# Configure em Settings > Secrets and variables > Actions:
#   BACKUP_DATABASE_URL  string de conexão do banco de PRODUÇÃO (de preferência de um usuário só de leitura)
#   BACKUP_PASSPHRASE    senha do backup (16+ caracteres). GUARDE-A TAMBÉM FORA DO GITHUB: sem ela o backup não abre.
on:
  schedule:
    - cron: "17 6 * * *" # 03:17 em São Paulo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Gerar e verificar backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Conferir segredos
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Defina os segredos BACKUP_DATABASE_URL e BACKUP_PASSPHRASE (ver o comentário no topo do arquivo)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run build -w @burger-lab/api
      - name: Criar backup
        run: npm run backup -w @burger-lab/api -- "$GITHUB_WORKSPACE/backups"
      - name: Verificar (decifra e confere o arquivo)
        run: |
          for f in "$GITHUB_WORKSPACE"/backups/*.blbk; do
            npm run backup:verify -w @burger-lab/api -- "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/*.blbk
          retention-days: 30
          if-no-files-found: error
